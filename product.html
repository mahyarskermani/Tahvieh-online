function tab(t){if(t==='reviews'){$('tabcontent').innerHTML='<div class="review-box"><strong>امتیاز شما به این محصول</strong><div class="stars">'+[1,2,3,4,5].map(n=>'<button type="button" data-star="'+n+'" aria-label="'+n+' ستاره">'+n+' ★</button>').join('')+'</div><p class="muted">امتیازها در این پیش‌نمایش فقط در مرورگر شما ذخیره می‌شوند و میانگین عمومی ندارند.</p><p id="reviewstatus"></p></div>';const key='tahvieh-rating-'+(p.id||p.model||p.name);const v=localStorage.getItem(key);if(v)$('reviewstatus').textContent='امتیاز ثبت‌شده شما: '+fmt(v)+' از ۵';$('tabcontent').querySelectorAll('[data-star]').forEach(b=>b.onclick=()=>{localStorage.setItem(key,b.dataset.star);$('reviewstatus').textContent='امتیاز شما: '+fmt(b.dataset.star)+' از ۵ (فقط این مرورگر)'});}else if(t==='files'){$('tabcontent').textContent='فایل کاتالوگ و دیتاشیت این محصول هنوز بارگذاری نشده است.';}else $('tabcontent').textContent=contents[t];document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t))}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));tab('desc');calc();const itemKey=String(p.id||p.model||p.name);function localSet(k){try{return new Set(JSON.parse(localStorage.getItem(k)||'[]'))}catch{return new Set()}}function toggleSaved(k,btn,label){const saved=localSet(k);if(saved.has(itemKey))saved.delete(itemKey);else saved.add(itemKey);localStorage.setItem(k,JSON.stringify([...saved]));btn.textContent=(saved.has(itemKey)?'✓ ':'♡ ')+label;btn.setAttribute('aria-pressed',String(saved.has(itemKey)))}$('favorite').onclick=()=>toggleSaved('tahvieh-favorites-v1',$('favorite'),'علاقه‌مندی');$('compare').onclick=()=>toggleSaved('tahvieh-compare-v1',$('compare'),'مقایسه');$('reviewjump').onclick=()=>{tab('reviews');document.querySelector('.sections').scrollIntoView({behavior:'smooth'})};
</script></body></html>
