<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دسته‌بندی محصولات | تهویه آنلاین</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f9fc;color:#203347;font:14px Tahoma,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}.top{background:white;border-bottom:1px solid #e4e9ef;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;gap:14px}.logo{font-weight:900;font-size:22px}.logo em{font-style:normal;color:#ee781c}.shell{max-width:1260px;margin:28px auto;padding:0 20px}.subtitle{color:#77869a;line-height:2}.layout{display:grid;grid-template-columns:205px 1fr;gap:22px}.rail,.main{background:white;border:1px solid #e4eaf0;border-radius:18px;padding:20px}.rail{align-self:start;position:sticky;top:12px}.rail button{width:100%;display:flex;align-items:center;gap:12px;text-align:right;border:0;background:transparent;padding:14px 10px;border-radius:12px;color:#405267}.rail button.active{background:#fff0e5;color:#ba5708;font-weight:bold}.mini{width:50px;height:50px;object-fit:contain;border-radius:10px;background:#f2f5f8;padding:5px}.emoji{font-size:29px}.mainhead{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #e8edf2;padding-bottom:18px}.mainhead h2{margin:0;font-size:19px}.all{color:#385e89;font-weight:bold}.accordion{border-bottom:1px solid #edf0f3}.accbtn{display:flex;justify-content:space-between;align-items:center;width:100%;padding:19px 5px;background:transparent;border:0;text-align:right;font-weight:bold;color:#263a4b}.chev{font-size:20px;transition:transform .2s}.accbtn[aria-expanded=true] .chev{transform:rotate(180deg)}.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding:10px 0 28px}.tile{display:flex;flex-direction:column;align-items:center;gap:11px;padding:16px 8px;border-radius:15px;border:1px solid transparent;text-align:center;transition:.2s}.tile:hover,.tile:focus-visible{background:#fff5ec;border-color:#ffd2aa;transform:translateY(-2px)}.art{width:120px;height:112px;border-radius:14px;background:linear-gradient(140deg,#e9f0f5,#f9fbfc);display:grid;place-items:center;overflow:hidden}.art svg{width:100%;height:100%}.tile strong{font-weight:500;line-height:1.8}.empty{color:#73859a;padding:30px}.mobilecats{display:none}@media(max-width:750px){.top{padding:15px 20px}.shell{padding:0 10px;margin:14px auto}.layout{display:block}.rail{display:none}.mobilecats{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 17px;scrollbar-width:thin}.mobilecats button{border:1px solid #dce5ed;background:white;border-radius:14px;min-width:95px;padding:10px 8px;display:grid;justify-items:center;gap:7px;white-space:nowrap}.mobilecats button.active{border-color:#f39142;background:#fff2e7;color:#ac530c}.mobilecats .emoji{font-size:27px}.main{padding:15px}.mainhead h2{font-size:17px}.tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}.art{width:100%;height:95px}.tile{padding:10px 2px;gap:7px}.tile strong{font-size:12px}.accbtn{font-size:13px}}@media(min-width:751px) and (max-width:1050px){.tiles{grid-template-columns:repeat(3,1fr)}}@media(min-width:1051px){.tiles{grid-template-columns:repeat(4,1fr)}}
</style></head><body><header class="top"><a href="index.html" class="logo">تهویه <em>آنلاین</em></a><a href="index.html">بازگشت به فروشگاه ←</a></header><main class="shell"><h1>دسته‌بندی محصولات</h1><p class="subtitle">دسته اصلی را انتخاب کنید و سپس روی زیردسته موردنظر بزنید تا محصولات مرتبط را ببینید.</p><div class="mobilecats" id="mobilecats"></div><div class="layout"><aside class="rail" id="rail"></aside><section class="main"><div class="mainhead"><h2 id="title"></h2><a class="all" id="all" href="index.html#products">مشاهده همه محصولات ←</a></div><div id="sections"></div></section></div></main><script>
const fan='<svg viewBox="0 0 120 110" aria-hidden="true"><defs><linearGradient id="m" x2="1" y2="1"><stop stop-color="#d4e3eb"/><stop offset="1" stop-color="#607d90"/></linearGradient></defs><path d="M12 93h95l9 11H5z" fill="#7b94a4"/><rect x="13" y="40" width="43" height="54" rx="7" fill="#ed812d"/><circle cx="71" cy="56" r="44" fill="#395b73" stroke="#b7c8d2" stroke-width="5"/><circle cx="71" cy="56" r="34" fill="url(#m)"/><g fill="#dbe6ec" transform="translate(71 56)">'+Array.from({length:8},(_,i)=>'<path transform="rotate('+(i*45)+')" d="M0 0Q-20 -16 -6 -30Q15 -29 8 -8Z"/>').join('')+'<circle r="7" fill="#36516a"/></g></svg>';
const axial='<svg viewBox="0 0 120 110" aria-hidden="true"><rect x="15" y="19" width="90" height="75" rx="13" fill="#8aa8b8"/><circle cx="60" cy="56" r="37" fill="#244b63" stroke="#d0dfe7" stroke-width="5"/><g fill="#a5c5d4" transform="translate(60 56)">'+Array.from({length:6},(_,i)=>'<ellipse transform="rotate('+(i*60)+')" cx="0" cy="-17" rx="11" ry="21"/>').join('')+'<circle r="9" fill="#345a72"/></g></svg>';
const duct='<svg viewBox="0 0 120 110" aria-hidden="true"><path d="M15 35l70-20 21 22-69 22z" fill="#b3c8d4"/><path d="M15 35v40l22 23V59z" fill="#647f91"/><path d="M37 59l69-22v41L37 98z" fill="#8faaba"/><path d="M49 61l45-14" stroke="#edf4f7" stroke-width="5"/><path d="M49 75l45-14" stroke="#edf4f7" stroke-width="5"/></svg>';
const categories=[
{id:'centrifugal',name:'سانتریفیوژ',icon:'🌀',groups:[{title:'فن سانتریفیوژ بر اساس نوع پروانه',items:[['فوروارد',fan],['بکوارد',fan],['رادیال',fan]]},{title:'فن سانتریفیوژ بر اساس کاربرد',items:[['فشار بالا',fan],['فشار متوسط',fan],['اگزاست صنعتی',fan]]}]},
{id:'axial',name:'فن آکسیال',icon:'💨',groups:[{title:'فن آکسیال بر اساس ساختار',items:[['آکسیال دیواری',axial],['آکسیال کانالی',axial],['آکسیال صنعتی',axial]]}]},
{id:'duct',name:'تهویه کانالی',icon:'▤',groups:[{title:'تجهیزات کانالی',items:[['فن بین‌کانالی',duct],['هواکش کانالی',duct],['تجهیزات نصب کانال',duct]]}]},
{id:'accessories',name:'تجهیزات جانبی',icon:'⚙️',groups:[{title:'لوازم و قطعات',items:[['لرزه‌گیر',duct],['کاور و محافظ',fan],['فلنج و اتصالات',duct]]}]}
];
const $=id=>document.getElementById(id);let active=new URLSearchParams(location.search).get('category')||'centrifugal';if(!categories.some(x=>x.id===active))active='centrifugal';const saved=()=>{try{return JSON.parse(localStorage.getItem('tahvieh-admin-demo-v1')||'{}').products||[]}catch{return []}};
function linkFor(label){const ps=saved(),words=label.toLowerCase().split(/\s+/),i=ps.findIndex(p=>words.some(w=>w.length>2&&String(p.name+' '+p.model).toLowerCase().includes(w)));return i>=0?'product.html?index='+i:'index.html#products'}
function render(){const c=categories.find(x=>x.id===active);$('title').textContent=c.name;$('rail').innerHTML=categories.map(x=>'<button data-cat="'+x.id+'" class="'+(x.id===active?'active':'')+'"><span class="emoji">'+x.icon+'</span>'+x.name+'</button>').join('');$('mobilecats').innerHTML=categories.map(x=>'<button data-cat="'+x.id+'" class="'+(x.id===active?'active':'')+'"><span class="emoji">'+x.icon+'</span>'+x.name+'</button>').join('');$('sections').innerHTML=c.groups.map((g,i)=>'<div class="accordion"><button class="accbtn" aria-expanded="'+(i===0)+'" data-acc="'+i+'">'+g.title+' <span class="chev">⌄</span></button><div class="tiles" id="g'+i+'" '+(i===0?'':'hidden')+'>'+g.items.map(([name,art])=>'<a class="tile" href="'+linkFor(name)+'" title="'+name+'"><div class="art">'+art+'</div><strong>'+name+'</strong></a>').join('')+'</div></div>').join('')}
document.addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(b){active=b.dataset.cat;history.replaceState(null,'','?category='+active);render();return}const a=e.target.closest('[data-acc]');if(a){const open=a.getAttribute('aria-expanded')==='true';a.setAttribute('aria-expanded',String(!open));$('g'+a.dataset.acc).hidden=open}});render();
</script></body></html>
